<form method="post" action="{% url 'main:toggle_like' experience.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in experience.liked_by.all %} is-starred{% endif %}"
            title="{% if experience.liked_by.all %}Disukai oleh {{ experience.liked_by.all|join:', ' }}{% else %}Jadilah yang pertama memberi like{% endif %}">
        {% if user in experience.liked_by.all %}Unlike{% else %}Like{% endif %}
        <span class="star-count">{{ experience.liked_by.count }}</span>
    </button>
</form>
