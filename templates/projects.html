<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ short_name }} - Projects</title>
    <link rel="icon" type="image/x-icon" href="/static/img/kirara.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">
                    <button>Profile</button>
                </a>
                <a href="{% url 'main:show_experience' %}">
                    <button>Experience</button> 
                </a>
                <a href="{% url 'main:show_projects' %}">
                    <button>Projects</button>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <section class="project-section" id="project">
            <div class="container">
                <p class="section-kicker">My projects so far</p>
                <h1 class="page-title">Projects</h1>

                <div class="project-grid">
                    {% for project in projects_list %}
                        <article class="project-card">
                            <div class="project-card-content">
                                <span class="project-badge">ITEM #{{ forloop.counter }}</span>
                                <h2>{{ project.title }}</h2>
                                <p class="project-description">
                                    {{ project.description }}
                                </p>
                            </div>
                            
                            <a href="{{ project.link }}" class="project-link" target="_blank" rel="noopener">
                                <img src="/static/img/github.svg" alt="GitHub Logo" class="project-btn-icon">
                                <span>View on GitHub</span>
                            </a>
                        </article>
                    {% empty %}
                        <div class="empty-state-box">
                            <p class="empty-state">No project has been added yet.</p>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
