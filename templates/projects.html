<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ short_name }} - Portfolio</title>
    <link rel="icon" type="image/x-icon" href="/static/img/kirara.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="project-section" id="project">
            <div class="container">
                <p class="section-kicker">My projects so far</p>
                <h1>Projects</h1>

                <div class="project-grid">
                    {% for project in projects_list %}
                        <article class="project-card">
                            <h2>{{ project.title }}</h2>
                            <p class="project-description">
                                {{ project.description }}
                            </p>
                            <a href="{{ project.link }}" class="project-link">
                                View on GitHub
                            </a>
                        </article>
                    {% empty %}
                        <p class="empty-state">
                            No project has been added yet.
                        </p>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
