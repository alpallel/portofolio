{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="project-section" id="project">
            <div class="container">
                <p class="section-kicker">My projects so far</p>
                <h1 class="page-title">Projects</h1>

                <div class="project-grid">
                    {% for project in projects_list %}
                        <article class="project-card">
                            <div class="project-card-content">
                                <span class="project-badge">ITEM #{{ forloop.counter }}</span>
                                <h2>{{ project.title }}</h2>
                                <p class="project-description">
                                    {{ project.description }}
                                </p>
                            </div>
                            
                            <a href="{{ project.link }}" class="project-link" target="_blank" rel="noopener">
                                <img src="/static/img/github.svg" alt="GitHub Logo" class="project-btn-icon">
                                <span>View on GitHub</span>
                            </a>
                        </article>
                    {% empty %}
                        <div class="empty-state-box">
                            <p class="empty-state">No project has been added yet.</p>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
